<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KuruKuruGames</title>
<meta name="description" content="個人でゲームを開発しています。配信中のタイトル: ロストエンダース（iOS / Android）。">
<link rel="icon" href="assets/img/kurukuru-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="brand" href="./">
      <img src="assets/img/kurukuru-logo.png" alt="" width="300" height="240">
      <span>KuruKuruGames</span>
    </a>
    <nav class="nav" aria-label="メイン">
      <a href="./" aria-current="page">Home</a>
      <a href="privacy-policy/">Privacy Policy</a>
      <a href="contact/">Contact</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <section class="section" aria-labelledby="games">
    <div class="section-head"><h2 id="games">配信中のゲーム</h2></div>

    <article class="game">
      <img class="game__icon" src="assets/img/lostenders-icon.png" alt="ロストエンダース アイコン" width="152" height="152">
      <div class="game__body">
        <h3 class="game__title">ロストエンダース</h3>
        <div class="stores">
          <a href="https://apps.apple.com/us/app/%E3%83%AD%E3%82%B9%E3%83%88%E3%82%A8%E3%83%B3%E3%83%80%E3%83%BC%E3%82%B9-%E5%86%92%E9%99%BA%E8%80%85%E3%81%A8%E5%BF%98%E3%82%8C%E3%82%89%E3%82%8C%E3%81%9F%E7%A7%98%E5%AE%9D/id6502868763">
            <img src="assets/img/badge-appstore-ja.png" alt="App Store からダウンロード" width="422" height="125">
          </a>
          <a href="https://play.google.com/store/apps/details?id=jp.co.kurukurugames.lostenders">
            <img src="assets/img/badge-googleplay-ja.png" alt="Google Play で手に入れよう" width="420" height="125">
          </a>
        </div>
      </div>
    </article>
  </section>

  <section class="section" aria-labelledby="about">
    <div class="section-head"><h2 id="about">紹介</h2></div>
    <span class="tag">Indie / Solo</span>
    <p class="lede">個人でゲームを開発しています。</p>
  </section>

  <section class="section" id="contact" aria-labelledby="contact-h">
    <div class="section-head"><h2 id="contact-h">連絡先</h2></div>
    <div class="contact">
      <a href="mailto:kurukurugames.developer@gmail.com">
        <span class="label">Mail</span>kurukurugames.developer@gmail.com
      </a>
      <a href="https://x.com/_KuruKuruGames">
        <span class="label">X</span>@_KuruKuruGames
      </a>
    </div>
  </section>

  <div class="foot">© KuruKuruGames</div>
</main>

</body>
</html>
